<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cook Book — рецепты на каждый день</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <a href="#" class="logo">Cook Book</a>
            <nav aria-label="Основная навигация">
                <ul class="nav-list">
                    <li><a href="#recipes">Рецепты</a></li>
                    <li><a href="#search">Поиск</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero container">
            <h1>Рецепты на каждый день</h1>
            <p>Проверенные блюда с указанием времени, сложности и кухни. Данные загружаются с backend по REST API.</p>
        </section>

        <section id="recipes" class="container">
            <div class="section-head">
                <h2>Каталог рецептов</h2>
                <button type="button" class="btn btn--primary" id="open-modal">+ Добавить рецепт</button>
            </div>

            <div id="search" class="controls">
                <div class="field">
                    <label for="query">Поиск</label>
                    <input type="text" id="query" placeholder="Название или ингредиент" autocomplete="off">
                </div>
                <div class="field">
                    <label for="filter-cuisine">Кухня</label>
                    <select id="filter-cuisine"><option value="all">Все кухни</option></select>
                </div>
                <div class="field">
                    <label for="sort">Сортировка</label>
                    <select id="sort">
                        <option value="name-asc">Название: А–Я</option>
                        <option value="name-desc">Название: Я–А</option>
                        <option value="time-asc">Время: сначала быстрые</option>
                        <option value="time-desc">Время: сначала долгие</option>
                    </select>
                </div>
            </div>

            <p class="results" id="results" aria-live="polite"></p>
            <div class="cards" id="cards"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container"><p>Cook Book · backend: FastAPI</p></div>
    </footer>

    <div class="modal" id="modal" hidden>
        <div class="modal__backdrop" data-close></div>
        <div class="modal__dialog" role="dialog" aria-modal="true">
            <div class="modal__head">
                <h2 id="modal-title">Новый рецепт</h2>
                <button type="button" class="modal__close" data-close aria-label="Закрыть">×</button>
            </div>

            <form id="recipe-form" class="form" novalidate>
                <div class="field">
                    <label for="name">Название</label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="200">
                    <p class="error" role="alert"></p>
                </div>
                <div class="field">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="2" maxlength="1000"></textarea>
                    <p class="error" role="alert"></p>
                </div>
                <div class="form__row">
                    <div class="field">
                        <label for="time">Время, мин</label>
                        <input type="number" id="time" name="time_minutes" required min="1" max="600">
                        <p class="error" role="alert"></p>
                    </div>
                    <div class="field">
                        <label for="difficulty">Сложность</label>
                        <select id="difficulty" name="difficulty" required>
                            <option value="">Выберите…</option>
                            <option value="Лёгкая">Лёгкая</option>
                            <option value="Средняя">Средняя</option>
                            <option value="Сложная">Сложная</option>
                        </select>
                        <p class="error" role="alert"></p>
                    </div>
                </div>
                <div class="field">
                    <label for="cuisine">Кухня</label>
                    <input type="text" id="cuisine" name="cuisine" required minlength="1" maxlength="100"
                           list="cuisine-options" placeholder="Итальянская">
                    <datalist id="cuisine-options"></datalist>
                    <p class="error" role="alert"></p>
                </div>
                <div class="field">
                    <label for="image_url">Ссылка на изображение</label>
                    <input type="text" id="image_url" name="image_url" maxlength="500">
                    <p class="error" role="alert"></p>
                </div>

                <p class="form-error" id="form-error" role="alert"></p>

                <div class="modal__actions">
                    <button type="button" class="btn" data-close>Отмена</button>
                    <button type="submit" class="btn btn--primary" id="form-submit">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
